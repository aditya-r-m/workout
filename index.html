<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <title>Workout</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20231f;
        background: #f5f4f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        background:
          radial-gradient(ellipse at 12% 0%, rgb(221 231 204 / 55%), transparent 34rem),
          #f5f4f0;
      }

      .app {
        width: min(100vw, 153.846dvh);
      }

      @media (orientation: portrait) {
        .app {
          width: min(100vw, 58.696dvh);
        }
      }

      .workout-ring {
        display: block;
        width: 100%;
        margin: 0 auto;
        overflow: visible;
      }

      .fixed-highlight {
        fill: #dceaff;
        stroke: #8baee8;
        stroke-width: 1;
        opacity: 0.9;
        filter: drop-shadow(0 0 8px rgb(85 135 220 / 55%));
      }

      .vertex text {
        fill: #68745c;
        font-size: 8.5px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    </style>
  </head>
  <body>
    <main class="app">
      <svg class="workout-ring" viewBox="0 0 800 520" role="img" aria-labelledby="ring-title ring-description">
        <title id="ring-title">Workout ring</title>
        <desc id="ring-description">Sixteen exercise names are arranged around a rotating three-dimensional ring.</desc>
        <rect class="fixed-highlight" id="fixed-highlight" y="246" width="96" height="28" rx="14"></rect>
        <g id="vertices"></g>
      </svg>
      <ol class="visually-hidden" id="exercise-list" aria-label="All exercises"></ol>
    </main>

    <script>
      const exercises = [
        "⌈Pull Up⌉",
        "⌈Row Up⌉",
        "⌈Face Pull⌉",
        "⌈Side Pull⌉",
        "⌊Planche Push⌋",
        "⌊Pike Push⌋",
        "⌊Push Kick⌋",
        "⌊Hook Punch⌋",
        "⌊Hip Hinge⌋",
        "⌊Calf Raise⌋",
        "⌈Arm Curl⌉",
        "⌈Wrist Raise⌉",
        "⌊Leg Lunge⌋",
        "⌊Calf Stretch⌋",
        "⌈Arm Extend⌉",
        "⌈Wrist Stretch⌉",
      ];
      const ringSvg = document.querySelector(".workout-ring");
      const fixedHighlight = document.querySelector("#fixed-highlight");
      const vertices = document.querySelector("#vertices");
      const exerciseList = document.querySelector("#exercise-list");
      const rotationStep = Math.PI / 8;
      const verticalRadius = 185;
      const ringTilt = 0.42;
      const animationDuration = 700;
      const reducedMotionDuration = 250;
      const swipeThreshold = 40;
      const currentIndexStorageKey = "workout-current-index";
      let isPortrait = window.matchMedia("(orientation: portrait)").matches;
      let horizontalRadius = isPortrait ? 65 : 115;
      let maximumDepth = horizontalRadius * Math.sin(ringTilt);

      function loadCurrentIndex() {
        let savedIndex;
        try {
          savedIndex = window.localStorage.getItem(currentIndexStorageKey);
        } catch (error) {
          console.error("Unable to retrieve the saved workout index.", error);
          return 0;
        }

        if (savedIndex === null) {
          return 0;
        }

        const index = Number(savedIndex);
        if (!savedIndex.trim() || !Number.isInteger(index) || index < 0 || index >= exercises.length) {
          console.warn("Ignoring an invalid saved workout index.", savedIndex);
          return 0;
        }

        return index;
      }

      function saveCurrentIndex(index) {
        try {
          window.localStorage.setItem(currentIndexStorageKey, String(index));
        } catch (error) {
          console.error("Unable to save the current workout index.", error);
        }
      }

      let currentIndex = loadCurrentIndex();
      let rotation = currentIndex * rotationStep;
      let destinationRotation = rotation;
      let animationFrame = null;
      let pointerStart = null;

      ringSvg.setAttribute("viewBox", isPortrait ? "265 30 270 460" : "0 0 800 520");

      function positionHighlight() {
        const rightmostDepth = -maximumDepth;
        const perspective = 760 / (760 - rightmostDepth);
        const rightmostLabelX = 400 + horizontalRadius * Math.cos(ringTilt) * perspective + 16;
        fixedHighlight.setAttribute("x", String(rightmostLabelX - 48));
      }

      function createDiagram() {
        exercises.forEach((name, index) => {
          const vertex = document.createElementNS("http://www.w3.org/2000/svg", "g");
          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
          vertex.classList.add("vertex");
          vertex.dataset.index = index;
          label.textContent = name;
          title.textContent = name;
          vertex.append(label, title);
          vertices.append(vertex);

          const item = document.createElement("li");
          item.textContent = name;
          exerciseList.append(item);
        });
      }

      function projectRingPoint(angle) {
        const sidePosition = Math.sin(angle);
        const x = -sidePosition * horizontalRadius * Math.cos(ringTilt);
        const y = Math.cos(angle) * verticalRadius;
        const z = sidePosition * horizontalRadius * Math.sin(ringTilt);
        const perspective = 760 / (760 - z);

        return {
          x: 400 + x * perspective,
          y: 260 + y * perspective,
          depth: z,
        };
      }

      function projectedPoints() {
        return exercises.map((_, index) =>
          projectRingPoint((index * Math.PI * 2) / exercises.length - rotation - Math.PI / 2)
        );
      }

      function getDepthScale(depth) {
        return 0.8 + (maximumDepth - depth) / (2 * maximumDepth) * 0.4;
      }

      function render() {
        const points = projectedPoints();

        for (const vertex of vertices.children) {
          const index = Number(vertex.dataset.index);
          const point = points[index];
          const label = vertex.firstElementChild;
          const horizontalOffset = point.x - 400;
          const verticalOffset = point.y - 260;
          const radialLength = Math.hypot(horizontalOffset, verticalOffset) || 1;
          const depthScale = getDepthScale(point.depth);
          const labelX = point.x + (horizontalOffset / radialLength) * 16;
          const labelY = point.y + (verticalOffset / radialLength) * 16;

          label.setAttribute("transform", `translate(${labelX} ${labelY}) scale(${depthScale})`);
          label.setAttribute("opacity", String(0.68 + (depthScale - 0.8) * 0.8));
        }
      }

      function rotateRing(direction) {
        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }

        const startRotation = rotation;
        destinationRotation += direction * rotationStep;
        const targetRotation = destinationRotation;
        currentIndex = (currentIndex + direction + exercises.length) % exercises.length;

        if (startRotation === targetRotation) {
          render();
          return;
        }

        const startedAt = performance.now();
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const duration = prefersReducedMotion
          ? reducedMotionDuration
          : animationDuration * Math.abs(targetRotation - startRotation) / rotationStep;
        function animate(now) {
          const progress = Math.min((now - startedAt) / duration, 1);
          const easedProgress = 0.5 - Math.cos(Math.PI * progress) / 2;

          if (progress < 1) {
            rotation = startRotation + (targetRotation - startRotation) * easedProgress;
            render();
            animationFrame = requestAnimationFrame(animate);
          } else {
            rotation = targetRotation;
            render();
            animationFrame = null;
          }
        }

        saveCurrentIndex(currentIndex);
        animationFrame = requestAnimationFrame(animate);
      }

      function updateOrientation() {
        const nextIsPortrait = window.matchMedia("(orientation: portrait)").matches;
        if (nextIsPortrait === isPortrait) {
          return;
        }

        isPortrait = nextIsPortrait;
        horizontalRadius = isPortrait ? 65 : 115;
        maximumDepth = horizontalRadius * Math.sin(ringTilt);
        ringSvg.setAttribute("viewBox", isPortrait ? "265 30 270 460" : "0 0 800 520");
        positionHighlight();
        render();
      }

      createDiagram();
      positionHighlight();
      render();
      window.addEventListener("resize", updateOrientation);

      document.addEventListener("pointerdown", (event) => {
        if (event.isPrimary && event.button === 0) {
          pointerStart = { id: event.pointerId, y: event.clientY };
        }
      });
      document.addEventListener("pointerup", (event) => {
        if (pointerStart === null || pointerStart.id !== event.pointerId) {
          return;
        }

        const distance = event.clientY - pointerStart.y;
        pointerStart = null;
        if (Math.abs(distance) >= swipeThreshold) {
          rotateRing(distance < 0 ? 1 : -1);
        }
      });
      document.addEventListener("pointercancel", (event) => {
        if (pointerStart?.id === event.pointerId) {
          pointerStart = null;
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowUp") {
          event.preventDefault();
          rotateRing(1);
        } else if (event.key === "ArrowDown") {
          event.preventDefault();
          rotateRing(-1);
        }
      });
    </script>
  </body>
</html>
